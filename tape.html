<!doctype html>
<html lang="en">
<head>

<title>Price tape</title>
<!-- Written by notion_panels.py — edit TAPE / TAPE_PAGE there, not this file. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1f1f1f; }
  #tape { position: absolute; left: 0; top: 0; border: 0; display: block; transform-origin: 0 0; }
</style>
</head>
<body>
<iframe id="tape" title="Price tape" scrolling="no" src="https://www.tradingview-widget.com/embed-widget/ticker-tape/?locale=en#%7B%22symbols%22%3A%5B%7B%22proName%22%3A%22CAPITALCOM%3AUS30%22%2C%22title%22%3A%22YM%22%7D%2C%7B%22proName%22%3A%22CAPITALCOM%3AUS100%22%2C%22title%22%3A%22NQ%22%7D%2C%7B%22proName%22%3A%22CAPITALCOM%3AUS500%22%2C%22title%22%3A%22ES%22%7D%2C%7B%22proName%22%3A%22CAPITALCOM%3ARTY%22%2C%22title%22%3A%22RTY%22%7D%2C%7B%22proName%22%3A%22BITSTAMP%3ABTCUSD%22%2C%22title%22%3A%22BTC%22%7D%5D%2C%22showSymbolLogo%22%3Atrue%2C%22isTransparent%22%3Afalse%2C%22displayMode%22%3A%22compact%22%2C%22colorTheme%22%3A%22dark%22%2C%22width%22%3A%22100%25%22%2C%22height%22%3A100%2C%22utm_source%22%3A%22notion.so%22%2C%22utm_medium%22%3A%22widget%22%2C%22utm_campaign%22%3A%22ticker-tape%22%7D"></iframe>
<script>
  // TradingView draws the tape 74 px tall whatever the box. Give it that, then scale it to the box.
  var NATURAL = 74, tape = document.getElementById("tape");
  function fit() {
    var s = Math.max(0.5, window.innerHeight / NATURAL);
    tape.style.height = NATURAL + "px";
    tape.style.width = Math.ceil(window.innerWidth / s) + "px";
    tape.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();
</script>
</body>
</html>
